name: build matrix

# P-607: verify the build on all three OS families and record per-OS build
# commands, plugin deployment shape and known limits. Build-and-test only —
# this workflow never publishes: no tags, no releases, no release assets
# (the rolling nightly release stays owned by nightly.yml).
on:
  workflow_dispatch:
    inputs:
      # Which macOS runner label to use. GitHub's per-org pool config for a
      # given label differs between orgs, so a label that is provisioned here
      # may be refused elsewhere ("The configuration ... is not supported");
      # pass another label to bypass that without editing the workflow.
      macos_label:
        description: 'macOS runner label'
        required: false
        default: 'macos-14'
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.2'
          modules: 'qtimageformats'
          cache: true
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure | tail -60
      - name: Record plugin deployment shape
        run: |
          BIN=$(find build -maxdepth 3 -type f -name pentimento -executable | head -1)
          test -n "$BIN"
          ./scripts/package-linux.sh "$BIN" dist
          {
            echo "linux: bundled lib+plugins tree"
            find dist -type f | sort
          } >> summary.txt
          QT_QPA_PLATFORM=offscreen ./dist/pentimento-linux-x64/pentimento --help >/dev/null
          echo "linux: --help smoke ok" >> summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-record
          path: summary.txt
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.2'
          modules: 'qtimageformats'
          cache: true
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build app targets
        run: cmake --build build --config Release --target pentimento_core --target pentimento
      - name: Record plugin deployment shape
        run: |
          $bin = (Get-ChildItem -Recurse -Filter pentimento.exe build | Select-Object -First 1).FullName
          $stage = Join-Path $env:RUNNER_TEMP 'deploy'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$bin" $stage
          $wq = Get-Command windeployqt -ErrorAction SilentlyContinue
          if (-not $wq) { $wq = Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe' }
          $out = @("windows: $bin",
                   "windows: windeployqt --no-compiler-runtime (staged copy)")
          $out += & $wq --no-compiler-runtime "$stage\pentimento.exe" 2>&1 |
            Select-Object -Last 6
          $out += "windows: deployed files"
          $out += Get-ChildItem -Recurse -File $stage |
            ForEach-Object { $_.FullName.Substring($stage.Length + 1) } | Sort-Object
          $out | Out-File deploy-list.txt
          Get-Content deploy-list.txt
      # Test targets are POSIX-coupled: ten of them simulate read-only and
      # unreadable files with chmod(2)/geteuid(2), which Windows has no
      # equivalent of (the Windows mechanism is FILE_ATTRIBUTE_READONLY).
      # Record that limit instead of letting it abort the deployment record.
      - name: Build test targets
        continue-on-error: true
        run: |
          cmake --build build --config Release > build-tests.txt 2>&1
          Select-String -Path build-tests.txt -Pattern 'error C\d+' |
            ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique > test-build-errors.txt
          Get-Content test-build-errors.txt
      - name: Test
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure > tests.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-record
          path: |
            deploy-list.txt
            test-build-errors.txt
            tests.txt
          if-no-files-found: ignore

  macos:
    # continue-on-error: this is a verification record, not a gate. If the
    # chosen runner label is not provisioned for this org the job is refused
    # before any step runs, and we still want the linux/windows evidence.
    continue-on-error: true
    runs-on: ${{ inputs.macos_label || 'macos-14' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.2'
          modules: 'qtimageformats'
          cache: true
      - name: Install build tools
        run: brew install ninja
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build app targets
        run: cmake --build build --target pentimento_core --target pentimento
      - name: Record plugin deployment shape
        run: |
          {
            echo "macos: $(ls -d build/pentimento.app 2>/dev/null)"
            echo "macos: macdeployqt -no-strip"
            macdeployqt "$(ls -d build/pentimento.app 2>/dev/null)" -no-strip 2>&1 | tail -25 || true
            echo "macos: PlugIns"
            find build/pentimento.app/Contents/PlugIns -type f 2>/dev/null | sort | head -25
            echo "macos: otool -L"
            otool -L build/pentimento.app/Contents/MacOS/pentimento 2>/dev/null | head -15
          } > deploy-log.txt 2>&1
          cat deploy-log.txt
      # Same POSIX coupling as the windows leg: see that job's comment.
      - name: Build test targets
        continue-on-error: true
        run: |
          cmake --build build > build-tests.txt 2>&1
          grep -E 'error:' build-tests.txt | sort -u > test-build-errors.txt || true
          cat test-build-errors.txt
      - name: Test
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure > tests.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: macos-record
          path: |
            deploy-log.txt
            test-build-errors.txt
            tests.txt
          if-no-files-found: ignore
